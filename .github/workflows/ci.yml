name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install duckdb CLI (test oracle)
        run: |
          curl -sSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      - name: Run the worked example
        run: opam exec -- dune exec examples/trades.exe -- "$RUNNER_TEMP/trades.parquet"
  obj-magic:
    uses: winterchill-trading/infra/.github/workflows/obj-magic.yml@main
